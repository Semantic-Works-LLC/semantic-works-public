    .fold > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 14px; margin: 0; cursor: pointer; background: #2f2f2d; }   /* a mid grey, between the panel and the card, so the heading reads as a bar */
    .fold > header:hover { background: #383836; }

    #actions .action button:disabled, #actions .action button:disabled:hover { background: #2563eb; }
    #actions .action span { font-size: 0.82rem; line-height: 1.45; color: var(--text-muted); padding-top: 5px; }

    .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

    .menu-anchor { position: relative; display: inline-flex; }
    #speed-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; width: 92px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    svg.zoomed { cursor: grab; }

    #view-menu { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 10; width: 170px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }

    .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px; }
    svg { display: block; width: 100%; height: 100%; }

    .ring { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }

    .dot.cook { background: #fff; color: #0d0d0d; }

    /* SVG parts */
    .wall { fill: none; stroke: var(--wall); stroke-width: 4; stroke-linecap: square; }
    .zone-label { fill: var(--text-muted); font-size: 13px; letter-spacing: 2px; }
    .small-label { fill: var(--text-muted); font-size: 10px; }
    .table-top { fill: var(--wood); stroke: var(--free); stroke-width: 3; transition: fill 200ms ease, stroke 200ms ease; }
    .table.reserved .table-top { stroke: var(--arriving); }
    .table.reading .table-top { fill: var(--menu); stroke: var(--menu); }
    .table.ready .table-top, .table.ordering .table-top { fill: var(--ready); stroke: var(--ready); }

    .table.eating .table-top { fill: var(--eating); stroke: var(--eating); }
    .table.reading .table-num, .table.ready .table-num, .table.ordering .table-num,
    .table.waiting .table-num, .table.eating .table-num { fill: #0d0d0d; }
    .table-num { fill: #fff; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .seat { fill: var(--seat); }
    .plate { fill: #ffffff; stroke: #0d0d0d; stroke-width: 1; visibility: hidden; }
    .table.eating .plate.on { visibility: visible; }
    .bubble { visibility: hidden; }
    .table.ready .bubble { visibility: visible; animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .steel { fill: var(--steel); stroke: #6a737b; stroke-width: 1.5; }
    .burner { fill: #23272b; stroke: #6a737b; stroke-width: 1.5; }
    .flame { fill: #eb6834; opacity: 0; }
    .progress-track { fill: #23272b; }
    .progress-bar { fill: #eb6834; }
    .ticket { fill: #f5f2e6; stroke: #b9b39c; stroke-width: 0.8; }
    .ticket-text { fill: #1a1a19; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .staff-label { font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .guest { stroke: #0d0d0d; stroke-width: 1; }
    .flame, .progress-track, .progress-bar { pointer-events: none; }
    [data-selectable] { cursor: pointer; }
    /* the selected object: a light grey outline with a faint halo, enough to find it without shouting */
    [data-selected] { filter: drop-shadow(0 0 3px rgba(227, 225, 214, 0.45)); }
    [data-selected] :is(.table-top, .flow-box, .loop-station, .steel, .burner, .ticket, .guest, .person, .dish, .token-box, .des-stage, .des-chip, .des-track, .des-rail, .graph-node),

    .table[data-selected] .table-top { stroke: #fff; stroke-width: 5; }
    /* a selected Scorecard tile keeps its own edge, green, amber or red; the outline is a ring just outside it */
    .score-ring { fill: none; display: none; }   /* not drawn at all until selected, so it does not change the measured size of the picture */
    [data-selected] > .score-ring { display: inline; stroke: var(--select); stroke-width: 2.5; }
    [data-selected] .score-tile { stroke: var(--hairline); stroke-width: 1.5; }
    [data-selected] .score-tile.won { stroke: var(--eating); }
    [data-selected] .score-tile.lost { stroke: var(--waiting); }
    [data-selected] .score-tile.near { stroke: var(--ready); }   /* a table keeps its state colour inside; the white ring says it is the selected one */

    /* service view */
    .flow-box { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }

    .loop-station { fill: #23272b; stroke: #6a737b; stroke-width: 1; }

    .loop-button rect { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }
    .loop-button:hover rect { fill: #3a3a37; }
    .loop-button text { fill: var(--text-primary); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

    /* workflow view */
    .task-name { font-size: 10.5px; }

    .task-zone.queue { stroke: var(--text-muted); stroke-dasharray: 5 4; }   /* the waiting area: the same quiet grey as the section headings */
    .task-tag { fill: var(--text-muted); font-size: 7px; font-weight: 700; letter-spacing: 0.4px; }
    .task-tag.queue { fill: var(--ready); }
    .task-avg { fill: var(--text-secondary); font-size: 8.5px; text-anchor: end; }
    .objective-label { fill: var(--text-secondary); font-size: 12px; }
    .objective-value { fill: var(--text-primary); font-size: 12px; font-weight: 600; text-anchor: end; font-variant-numeric: tabular-nums; }

    /* model view */
    .flow-box.optional { stroke-dasharray: 7 4; }
    .flow-pill { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }
    .flow-pill.won { stroke: var(--eating); }
    .flow-pill.lost { stroke: var(--waiting); }

    /* DES view */
    .des-mono { fill: var(--text-secondary); font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }

    .des-meter.constrained { fill: var(--ready); }
    .des-meter.saturated { fill: var(--waiting); animation: pulse 0.9s ease-in-out infinite; }
    .des-badge { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-anchor: end; }
    .des-badge.constrained { fill: var(--ready); }
    .des-badge.saturated { fill: var(--waiting); animation: pulse 0.9s ease-in-out infinite; }
    .des-chip { fill: #2c2c2a; stroke: var(--text-muted); stroke-width: 1; }
    .des-chip-text { fill: var(--text-primary); font-size: 9.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
    .des-stage { fill: var(--page); stroke: var(--hairline); stroke-width: 1.5; }

    :where(.des-stage).won { stroke: var(--eating); }
    :where(.des-stage).lost { stroke: var(--waiting); }
    :where(.des-stage).near { stroke: var(--ready); }

    .des-stage-count { fill: var(--text-primary); font-size: 17px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .des-tile-label { fill: var(--text-muted); font-size: 8.5px; }
    .des-tile-value { fill: var(--text-primary); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* unit squares and plain tokens */
    .study-block.picked, .study-unit.picked { stroke: var(--select); stroke-width: 2.5; stroke-dasharray: none; }
    /* one unit of a resource: a hollow square while it is free, crossed through while it is taken. No blue: blue is for buttons */
    .study-unit { fill: transparent; stroke: #6a737b; stroke-width: 1; }
    .graph-start { fill: var(--text-muted); stroke: none; }   /* where the process starts */
    .study-unit.used { fill: url(#unit-cross); }
    .study-unit.party { fill: url(#unit-cross); }   /* a party in the building: crossed, like any unit that is active */
    .study-unit.out { fill: url(#unit-out); }   /* out of service: off sick, broken down, out of use */
    .out-mark { stroke: var(--waiting); stroke-width: 6; stroke-linecap: round; pointer-events: none; }
    .study-unit.part.used { fill: #b9bcc0; }
    .study-token-body, .token-box { fill: #b9bcc0; stroke: #0d0d0d; stroke-width: 1; }

    /* layout: the workspace keeps one fixed height; opening the panel only narrows the live view */
    .workspace { display: flex; align-items: stretch; width: 100%; flex: 1; min-height: 360px; }   /* down to the bottom of the window */
    .view-card { flex: 1; min-width: 0; height: 100%; }
    .panel { width: 0; height: 100%; overflow: hidden; transition: width 250ms ease, margin-left 250ms ease; }
    .panel.open { width: var(--panel-width, 340px); }
    /* the divider between the picture and the details: drag it to make the details wider or narrower */
    #panel-divider { flex: none; width: 0; align-self: stretch; position: relative; cursor: col-resize; touch-action: none; }
    .panel.open ~ #panel-divider, #panel-divider.open { width: 12px; }
    #panel-divider::after { content: ""; position: absolute; left: 4px; top: calc(50% - 24px); width: 4px; height: 48px; border-radius: 2px; background: var(--hairline); transition: background 120ms ease; }
    #panel-divider:hover::after, #panel-divider.dragging::after { background: var(--text-muted); }
    .workspace.resizing .panel { transition: none; }
    .workspace.resizing { user-select: none; cursor: col-resize; }
    .panel-inner { width: var(--panel-width, 340px); height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; }
    .about, .actors { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px; background: var(--page); }
    .about .kind { display: inline-block; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px; }
    .about h3 { font-size: 1.15rem; margin: 10px 0 12px; }
    .about dt { font-size: 0.75rem; font-weight: 600; color: #d6d4ca; margin-top: 12px; }   /* a heading inside a card: a step brighter than the text under it */
    .about dd { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.45; color: var(--text-muted); white-space: pre-line; }   /* running text in the details panel is the same quiet grey as "Nothing selected" */
    .about dl { margin: 0; }
    .metrics { margin-top: 10px; }
    .metric-value { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; }
    .metric-value b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .metric-value span { font-size: 0.78rem; color: var(--text-muted); }
    .verdict { font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
    .verdict.good { background: var(--eating); color: #fff; }
    .verdict.warn { background: var(--ready); color: #0d0d0d; }
    .verdict.bad { background: var(--waiting); color: #fff; }
    .verdict.none { background: var(--hairline); color: var(--text-secondary); }
    .metric-note { font-size: 0.75rem; line-height: 1.45; color: var(--text-muted); margin: 6px 0 0; }
    .chart { height: auto; }
    .figure { margin: 0 0 16px; }
    /* section headings inside a tab: the same small muted line as the labels on About */
    h4.section { font-size: 0.75rem; font-weight: 600; color: #d6d4ca; margin: 12px 0 6px; }   /* about 2.4 times the brightness of the text under it, and bolder, since it is set smaller */
    .about .measure { margin: 0 0 4px; font-size: 0.9rem; line-height: 1.45; color: var(--text-muted); }
    .figure .plot { background: #2a2a2a; border-radius: 8px; padding: 10px 10px 6px; }
    .figure figcaption { margin: 6px 0 0; }
    .chart text { fill: var(--text-secondary); font-size: 10px; }
    .chart .chart-track { fill: #23272b; }
    .empty { color: var(--text-muted); font-size: 0.9rem; line-height: 1.45; margin: 0; }
    .actors h3 { font-size: 1rem; margin: 0; }
    .actors summary { font-size: 0.72rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; cursor: pointer; }
    .actors .none { color: var(--text-muted); font-size: 0.78rem; margin: 0; }
    .actors [data-group] { display: flex; flex-wrap: wrap; gap: 4px; }
    .actor { font-size: 0.75rem; padding: 3px 8px; background: var(--surface); }
    .actor[aria-pressed="true"] { border-color: var(--select); background: #3a3a37; }
    @media (max-width: 820px) {
      main { height: auto; display: block; }
      .workspace { flex-direction: column; height: auto; }
      .view-card { flex: none; height: auto; aspect-ratio: 1200 / 660; }
      .panel { display: none; height: auto; }
      .panel.open { display: block; width: 100%; margin: 12px 0 0; }
      #panel-divider { display: none; }
      .panel-inner { width: 100%; height: auto; }
    }

</head>
<body>
  <main>
    <header>
      <h1>Semantic Works: Cyber Kitchen</h1>
      <span class="menu-anchor" id="view-switch">
        <button id="view-toggle" class="tool primary" aria-haspopup="menu" aria-expanded="false" aria-controls="view-menu"><span id="view-name"></span></button>
        <div class="actors" id="view-menu" role="menu" aria-label="Views" hidden></div>
      </span>
      <div class="controls">
        <button id="pause" class="tool primary" aria-pressed="false" aria-label="Pause" title="Pause">
          <svg id="icon-pause" class="solid" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg id="icon-play" class="solid" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <span class="menu-anchor">
          <button id="speed-toggle" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="speed-menu" aria-label="Speed: 1&times;. Choose a speed" title="Speed: 1&times;. Choose a speed">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8.500 8.500 0 1 1 16 0"/><path d="M12 17l4.500-7"/><circle cx="12" cy="17" r="1.200"/></svg>

// ===== js/helpers.js =====
// ---------- helpers ----------
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (parent) parent.appendChild(node);
  return node;
}
function text(content, attrs, parent) {
  const node = el("text", attrs, parent);
  node.textContent = content;
  return node;
}
const clockText = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");

// ===== js/prefs.js =====
// ---------- remembering how the page was left ----------
// Whether it was paused, the speed, the view, whether the details panel was open, which of its sections
// were unfolded and which tab was showing are kept in the browser's local storage, so the page comes back
// the way it was left. The simulation itself is not kept: it starts again from the beginning.
const PREFS_KEY = "cyber-kitchen.ui";
const prefs = (() => {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (error) { return {}; }   // storage is off, or what is in it cannot be read
})();
function keep(name, value) {
  prefs[name] = value;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (error) { /* storage is off: it lasts for this page only */ }
}

// ===== js/floor-plan.js =====
// ---------- floor plan ----------
const DOOR = { x: 60, y: 270, aisle: 270 };
const OUTSIDE = { x: -20, y: 270 };
const RAIL_COOK = { x: 926, y: 270 };     // where a cook takes it
const PASS_WAITER = { x: 762, y: 465 };   // dining-room side of the small table
const PASS_COOK = { x: 926, y: 465 };     // kitchen side of the small table

const SEATS = {
  six:   [[-36, -42], [-36, 42], [0, -42], [0, 42], [36, -42], [36, 42]],
  round: [[0, -45], [0, 45], [-45, 0], [45, 0]],
  two:   [[-40, 0], [40, 0]],
};
const LAYOUT = [
  ["six", "six", "round", "two"],
  ["round", "six", "six", "round"],
  ["six", "round", "six", "two"],
];
const COLS = [190, 330, 470, 610], ROWS = [170, 370, 565];
const SERVICE = [{ dy: 72, aisle: 270 }, { dy: -72, aisle: 270 }, { dy: -72, aisle: 465 }];

// The twelve tables: where each stands, its seats, and where a waiter stands to serve it.
const tables = [];
LAYOUT.forEach((row, r) => row.forEach((type, c) => {
  const x = COLS[c], y = ROWS[r];
  tables.push({ type, x, y, capacity: SEATS[type].length, seats: SEATS[type].map(([dx, dy]) => ({ x: x + dx, y: y + dy })), sp: { x, y: y + SERVICE[r].dy } });
}));

// ===== js/rng.js =====
// Seeded, reproducible random numbers (mulberry32). Same seed = the same run.
// A seed for one named stream: the run's seed mixed with the stream's name, so changing one part of
// the model does not shift another part's draws.
function streamSeed(seed, name) {
  let h = (0x811c9dc5 ^ (seed >>> 0)) >>> 0;
  for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 0x01000193) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0 || 1;
}
class Rng {
  constructor(seed) { this.s = seed >>> 0 || 1; }
  next() {
    let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  uniform(a, b) { return a + (b - a) * this.next(); }
  triangular(min, mode, max) {
    const u = this.next(), c = max > min ? (mode - min) / (max - min) : 0.5;
    return u < c ? min + Math.sqrt(u * (max - min) * (mode - min)) : max - Math.sqrt((1 - u) * (max - min) * (max - mode));
  }
  // Draw from a spec: a number, or { dist: "uniform" | "triangular", ... }.
  draw(spec) {
    if (typeof spec === "number") return spec;
    if (spec.dist === "uniform") return this.uniform(spec.min, spec.max);
    if (spec.dist === "triangular") return this.triangular(spec.min, spec.mode, spec.max);
    throw new Error(`unknown distribution: ${JSON.stringify(spec)}`);
  }
}

// ===== js/des-engine.js =====
// ---------- DES engine ----------
// The sole source of operational truth for the DES view. A clock, a priority queue of events (a
// min-heap), resource pools, FIFO queues and the state machine of every party. It has no DOM, no
// coordinates and no animation frame: it can be stepped one event at a time, run to a given time, or
// run headless. Renderers subscribe to its events and read snapshots; they never write.
//
// It started from the specification's three pools (tables, waiters, stoves) and was brought up to the
// whole restaurant: tables of different sizes, cooks, the pizza oven and the coffee machine, an order
// that is planned and then made as parts in parallel, and parties turned away when the door queue is full.
// Every time is in simulated seconds, to match the page's clock. Every number is invented.
const DES_CONFIG = {
  seed: 1,
  tables: [6, 6, 4, 2, 4, 6, 6, 4, 6, 4, 6, 2],   // seats of each table, in the order they stand on the floor
  capacity: { waiters: 2, cooks: 2, stoves: 2, oven: 1, coffee: 1 },
  hostQueueMax: 3,                                              // a party that finds this many waiting goes away
  interarrival: { dist: "uniform", min: 5, max: 10 },
  partySize: [[1, 1], [2, 4], [3, 2], [4, 4], [5, 1.5], [6, 2]],   // [guests, weight]
  pizzaChance: 0.3, coffeeChance: 0.4,                          // per guest
  dishes: {
    stoves: ["Grilled salmon", "Steak frites", "Mushroom risotto", "Chicken parmesan", "Pasta carbonara", "Caesar salad"],
    oven: ["Margherita pizza", "Pepperoni pizza", "Four cheese pizza"],
  },
  menu: { dist: "uniform", min: 5, max: 9 },                    // delay: reading the menu
  order: { dist: "triangular", min: 4, mode: 6, max: 9 },       // a waiter takes the order
  plan: 2,                                                      // a cook plans the order
  parts: {                                                      // each part needs a cook and one unit of the equipment
    stoves: { base: 4, perItem: 1.3 }, oven: { base: 4, perItem: 1.0 }, coffee: { base: 1, perItem: 0.5 },
  },
  plate: 2,                                                     // a cook plates the finished order
  run: { dist: "triangular", min: 4, mode: 6, max: 9 },         // a waiter runs the food
  dine: { dist: "uniform", min: 14, max: 22 },                  // delay: eating and billing
  // patience: a seated party that waits longer than this walks out without eating
  orderPatience: { dist: "uniform", min: 45, max: 90 },         // for a waiter to come and take the order
  foodPatience: { dist: "uniform", min: 90, max: 150 },         // for the food, counted from the order being placed
  // what we think is reasonable: waits a visit should stay within, queue waits, and shares of time in use
  targets: { table: 30, order: 15, food: 60, happy: 0.8 },
  queueTargets: { host: 30, order: 15, plan: 15, stoves: 10, oven: 10, coffee: 10, plate: 10, run: 10 },
  useTargets: { tables: { atLeast: 0.7 }, waiters: { atMost: 0.85 }, cooks: { atMost: 0.85 }, stoves: { atMost: 0.8 }, oven: { atMost: 0.8 }, coffee: { atMost: 0.8 } },
  arrivalsUntil: Infinity,                                      // close the door at this time, to let the system drain
};
const DES_KEEP = 40, DES_WINDOW = 180;
const DES_OUT = 0;   // a unit that is out of service; like null and false it is falsy, so "is it in use?" stays a plain truth test
const DES_STAFF = ["waiters", "cooks"], DES_STAFF_MAX = 6;   // pools whose size can be changed while the engine runs
// what a party in each queue is waiting for; a kitchen part needs its cook and its equipment at the same moment
const DES_QUEUE_NEEDS = { host: ["tables"], order: ["waiters"], plan: ["cooks"], stoves: ["cooks", "stoves"], oven: ["cooks", "oven"], coffee: ["cooks", "coffee"], plate: ["cooks"], run: ["waiters"] };
const DES_PART_EVENTS = { stoves: ["SEIZE_STOVE", "COOK_COMPLETE"], oven: ["SEIZE_OVEN", "BAKE_COMPLETE"], coffee: ["SEIZE_COFFEE", "COFFEE_COMPLETE"] };

class DESEngine {
  constructor(config = DES_CONFIG) {
    this.config = config;
    this.currentTime = 0;
    this.heap = [];           // the priority event queue, ordered by (timestamp, sequence)
    this.sequence = 0;
    this.eventsProcessed = 0;
    this.subscribers = [];
    this.streams = {};
    this.resources = {};      // pools; a unit is null when free, else { party, task, since, until }
    for (const [id, capacity] of [["tables", config.tables.length], ...Object.entries(config.capacity)]) {
      // a unit is null when free, an object when seized, false when it is not on shift (staff pools have spare places),
      // and DES_OUT when it is out of service: a person off sick, a machine broken down, a table out of use
      const places = DES_STAFF.includes(id) ? DES_STAFF_MAX : capacity;
      this.resources[id] = { capacity, allocated: 0, units: Array.from({ length: places }, (_, i) => i < capacity ? null : false), busyArea: 0, capArea: 0, since: 0, leaving: 0, goingOut: new Set() };
    }
    // FIFO buffers of party ids, each with what it has measured
    this.queues = {}; this.queueStats = {};
    this.blocked = {}; this.blockedSince = 0;   // party-seconds of waiting in each queue, by what was missing
    for (const id in config.queueTargets) { this.queues[id] = []; this.queueStats[id] = this.stats(); this.blocked[id] = {}; }
    this.parties = new Map();   // active parties by id
    this.stateStats = {};       // time spent in each state
    this.partStats = {};        // time each kitchen part takes, once a cook and its equipment have it
    for (const kind in config.parts) this.partStats[kind] = this.stats();
    this.arrived = 0; this.departed = 0; this.balked = 0; this.happy = 0; this.abandoned = 0; this.abandonedFor = { order: 0, food: 0 };
    this.ghosts = new Map();    // parties that walked out while a cook was still working on their order: the work in hand is finished, then dropped
    // telemetry: what the HUD is computed from
    this.arrivalLog = []; this.departureLog = []; this.wipLog = [[0, 0]];
    this.waits = { table: this.stats(), order: this.stats(), food: this.stats() };
    this.cycleTimes = this.stats();
    this.scheduleEvent(this.draw("arrival", config.interarrival), "PARTY_ARRIVED", "P1");
  }

  // ----- the dispatcher
  subscribe(fn) { this.subscribers.push(fn); }
  scheduleEvent(timestamp, type, entityId, resourceId, metadata) {
    const event = { id: "E" + ++this.sequence, seq: this.sequence, timestamp, type, entityId, resourceId, metadata };
    const h = this.heap;
    h.push(event);
    for (let i = h.length - 1; i > 0;) {
      const parent = (i - 1) >> 1;
      if (!this.before(h[i], h[parent])) break;
      [h[i], h[parent]] = [h[parent], h[i]];
      i = parent;
    }
  }
  before(a, b) { return a.timestamp !== b.timestamp ? a.timestamp < b.timestamp : a.seq < b.seq; }
  pop() {
    const h = this.heap, top = h[0], last = h.pop();
    if (h.length) {
      h[0] = last;
      for (let i = 0; ;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < h.length && this.before(h[l], h[m])) m = l;
        if (r < h.length && this.before(h[r], h[m])) m = r;
        if (m === i) break;
        [h[i], h[m]] = [h[m], h[i]];
        i = m;
      }
    }
    return top;
  }
  // Process the next event: advance the clock to it, apply its state transition, tell the subscribers.
  step() {
    if (!this.heap.length) return null;
    const event = this.pop();
    this.accrueBlocked(event.timestamp);
    this.currentTime = event.timestamp;
    this.processEvent(event);
    this.eventsProcessed++;
    for (const fn of this.subscribers) fn(event, this);
    return event;
  }
  // Process every event up to a time. How the caller slices time does not change the event sequence.
  runUntil(time) {
    while (this.heap.length && this.heap[0].timestamp <= time) this.step();
    if (time > this.currentTime) this.currentTime = time;
  }
  // Run with no renderer at all until nothing is left to do (needs arrivalsUntil to be finite).
  runToEnd() { while (this.step()); }

  // ----- randomness: one named, seeded stream per kind of draw
  rng(name) { return this.streams[name] ??= new Rng(streamSeed(this.config.seed, "des:" + name)); }
  draw(name, spec) { return this.rng(name).draw(spec); }

  // ----- measuring
  stats() { return { done: 0, total: 0, history: [], stays: [] }; }
  record(stats, seconds) {
    stats.done++; stats.total += seconds;
    stats.history.push(seconds);
    if (stats.history.length > DES_KEEP) stats.history.shift();
  }
  stay(stats) {
    const list = stats.stays;
    while (list.length && list[0].end !== null && list[0].end < this.currentTime - DES_WINDOW) list.shift();
    const one = { start: this.currentTime, end: null };
    list.push(one);
    return one;
  }

  // What the parties in a queue are missing right now: the pools it needs that have no unit free.
  // (At the door a table may be free and still not fit; then the tables are what is missing.)
  missing(id) {
    const short = DES_QUEUE_NEEDS[id].filter(pool => !this.available(pool));
    return short.length ? short : DES_QUEUE_NEEDS[id].slice(0, 1);
  }
  // Nothing changes between two events, so the waiting since the last one is charged to what was missing then.
  accrueBlocked(until) {
    const seconds = until - this.blockedSince;
    this.blockedSince = until;
    if (seconds <= 0) return;
    for (const id in this.queues) {
      if (!this.queues[id].length) continue;
      const cause = this.missing(id).join("+");
      this.blocked[id][cause] = (this.blocked[id][cause] || 0) + this.queues[id].length * seconds;
    }
  }

  // ----- resources
  available(id) { return this.resources[id].allocated < this.resources[id].capacity; }
  accrue(resource) {
    resource.busyArea += resource.allocated * (this.currentTime - resource.since);
    resource.capArea += resource.capacity * (this.currentTime - resource.since);
    resource.since = this.currentTime;
  }
  seize(id, party, task, unit) {
    const resource = this.resources[id];
    if (resource.allocated >= resource.capacity) throw new Error(`${id}: seized beyond capacity`);
    unit ??= resource.units.indexOf(null);
    if (resource.units[unit] !== null) throw new Error(`${id}: unit ${unit} seized while taken`);
    this.accrue(resource);
    resource.allocated++;
    resource.units[unit] = { party: party.id, task, since: this.currentTime, until: null };
    party.held[id + ":" + task] = unit;
    return unit;
  }
  release(id, party, task) {
    const resource = this.resources[id], unit = party.held[id + ":" + task];
    if (unit === undefined || resource.units[unit]?.party !== party.id) throw new Error(`${id}: ${party.id} released a unit it does not hold`);
    this.accrue(resource);
    resource.allocated--;
    resource.units[unit] = null;
    if (resource.goingOut.delete(unit)) { resource.capacity--; resource.units[unit] = DES_OUT; }   // went sick or broke down during the task: out now it is done
    else if (resource.leaving) { resource.leaving--; resource.capacity--; resource.units[unit] = false; }   // was asked to go: leaves now the task is done
    delete party.held[id + ":" + task];
  }
  // Take one unit out of service, or bring it back: a person goes off sick, a machine breaks down, a table
  // is taken out of use. A free unit goes at once; a busy one finishes the task it is on first. It keeps
  // its place, so it can be seen and brought back.
  setOut(id, unit, out) {
    const resource = this.resources[id], state = resource.units[unit];
    this.accrue(resource);
    if (out) {
      if (state === null) { resource.units[unit] = DES_OUT; resource.capacity--; }
      else if (state && !resource.goingOut.has(unit)) resource.goingOut.add(unit);
      else return false;
    } else if (resource.goingOut.delete(unit)) { /* had not gone yet: stays */ }
    else if (state === DES_OUT) { resource.units[unit] = null; resource.capacity++; }
    else return false;
    const event = { id: "E" + ++this.sequence, seq: this.sequence, timestamp: this.currentTime, type: out ? "UNIT_OUT" : "UNIT_BACK", entityId: "-", resourceId: `${id} ${unit + 1}` };
    for (const fn of this.subscribers) fn(event, this);
    this.dispatchTables();
    this.dispatchWaiters();
    this.dispatchKitchen();
    return true;
  }
  // Change how many waiters or cooks are on shift, by one, while the engine runs. One more starts at
  // once. One fewer: a free one leaves at once; if all are busy, the next to finish a task leaves.
  changeCapacity(id, by) {
    const resource = this.resources[id];
    this.accrue(resource);
    if (by > 0) {
      if (resource.leaving) resource.leaving--;   // someone was about to go: they stay
      else {
        const place = resource.units.indexOf(false);
        if (place < 0) return false;
        resource.units[place] = null; resource.capacity++;
      }
    } else {
      if (resource.capacity - resource.leaving <= 0) return false;
      const free = resource.units.lastIndexOf(null);
      if (free < 0) resource.leaving++;
      else { resource.units[free] = false; resource.capacity--; }
    }
    const event = { id: "E" + ++this.sequence, seq: this.sequence, timestamp: this.currentTime, type: by > 0 ? "CAPACITY_UP" : "CAPACITY_DOWN", entityId: "-", resourceId: id };
    for (const fn of this.subscribers) fn(event, this);
    this.dispatchWaiters();
    this.dispatchKitchen();
    return true;
  }
  // a timed task or delay: the party's event fires when it is over; the units it holds know when too
  after(party, seconds, type, resourceId, metadata) {
    const until = this.currentTime + seconds;
    party.until = until;
    this.scheduleEvent(until, type, party.id, resourceId, metadata);
    return until;
  }

  // ----- queues: every request for a resource goes through one, even if it does not have to wait
  enqueue(id, party) {
    this.queues[id].push(party.id);
    party.queued[id] = { since: this.currentTime, stay: this.stay(this.queueStats[id]) };
  }
  dequeue(id, party) {
    const queue = this.queues[id], entry = party.queued[id], waited = this.currentTime - entry.since;
    queue.splice(queue.indexOf(party.id), 1);
    entry.stay.end = this.currentTime;
    delete party.queued[id];
    this.record(this.queueStats[id], waited);
    return waited;
  }
  // The smallest free table that seats the party, or -1.
  tableFor(party) {
    let best = -1;
    this.resources.tables.units.forEach((unit, i) => {
      const seats = this.config.tables[i];
      if (unit === null && seats >= party.size && (best < 0 || seats < this.config.tables[best])) best = i;
    });
    return best;
  }
  // Seat everyone in the host queue who fits a free table, oldest first.
  dispatchTables() {
    for (const id of [...this.queues.host]) {
      const party = this.parties.get(id), table = this.tableFor(party);
      if (table < 0) continue;
      this.record(this.waits.table, party.metrics.tableWaitDuration = this.dequeue("host", party));
      party.table = this.seize("tables", party, "table", table);
      this.scheduleEvent(this.currentTime, "SEIZE_TABLE", party.id, "tables");
    }
  }
  // A free waiter takes the next job: running food first (it is getting cold), then taking an order.
  dispatchWaiters() {
    while (this.available("waiters") && (this.queues.run.length || this.queues.order.length)) {
      const deliver = this.queues.run.length > 0, party = this.parties.get((deliver ? this.queues.run : this.queues.order)[0]);
      const waited = this.dequeue(deliver ? "run" : "order", party);
      if (!deliver) this.record(this.waits.order, party.metrics.orderWaitDuration = waited);
      this.seize("waiters", party, deliver ? "deliver" : "order");
      this.scheduleEvent(this.currentTime, deliver ? "SEIZE_WAITER_DELIVER" : "SEIZE_WAITER_ORDER", party.id, "waiters");
    }
  }
  // A free cook takes the next kitchen job: plating first, then the parts of orders already planned,
  // then planning a new order. A part starts only when a cook and its equipment are both free, and
  // seizes both at once, so nobody holds one while waiting for the other.
  dispatchKitchen() {
    for (const job of ["plate", "stoves", "oven", "coffee", "plan"]) {
      const equipment = this.config.parts[job] ? job : null;
      while (this.queues[job].length && this.available("cooks") && (!equipment || this.available(equipment))) {
        const party = this.parties.get(this.queues[job][0]);
        this.dequeue(job, party);
        this.seize("cooks", party, job);
        if (equipment) this.seize(equipment, party, job);
        this.scheduleEvent(this.currentTime, equipment ? DES_PART_EVENTS[job][0] : job === "plan" ? "SEIZE_COOK_PLAN" : "SEIZE_COOK_PLATE", party.id, equipment || "cooks");
      }
    }
  }

  // ----- the entity state machine
  setState(party, state) {
    if (party.state) {
      this.record(this.stateStats[party.state] ??= this.stats(), this.currentTime - party.since);
      party.stateStay.end = this.currentTime;
    }
    party.state = state; party.since = this.currentTime; party.until = null;
    party.log.push([state, this.currentTime]);
    party.stateStay = this.stay(this.stateStats[state] ??= this.stats());
  }
  wip(change) {

  // time a task takes, and tell the units doing it when it ends
  task(party, seconds, type, pools, task, metadata) {
    const until = this.after(party, seconds, type, pools[0], metadata);
    for (const id of pools) this.resources[id].units[party.held[id + ":" + task]].until = until;
  }
  writeOrder(party) {
    const config = this.config, rng = this.rng("order"), counts = new Map();
    const add = item => counts.set(item, (counts.get(item) || 0) + 1);
    party.order = { stoves: 0, oven: 0, coffee: 0 };
    for (let i = 0; i < party.size; i++) {
      const kind = rng.next() < config.pizzaChance ? "oven" : "stoves";
      add(config.dishes[kind][Math.floor(rng.next() * config.dishes[kind].length)]);
      party.order[kind]++;
      if (rng.next() < config.coffeeChance) party.order.coffee++;
    }
    if (party.order.coffee) counts.set("Coffee", party.order.coffee);

  }
  processEvent(event) {

    let party = this.parties.get(event.entityId);
    if (!party && event.type !== "PARTY_ARRIVED") {   // the party is gone: only work still in hand for it matters
      const ghost = this.ghosts.get(event.entityId);
      if (ghost) this.processGhost(event, ghost);
      return;
    }
    switch (event.type) {

        for (const [guests, weight] of config.partySize) { if ((pick -= weight) <= 0) { size = guests; break; } }
        party = { id: event.entityId, number: Number(event.entityId.slice(1)), size, state: null, since: now, until: null, table: null, held: {}, queued: {},
                  order: null, parts: null, log: [], timestamps: { arrival: now },
                  metrics: { tableWaitDuration: 0, orderWaitDuration: 0, kitchenWaitDuration: 0, totalCycleTime: 0 } };
        const next = now + this.draw("arrival", config.interarrival);
        if (next <= config.arrivalsUntil) this.scheduleEvent(next, "PARTY_ARRIVED", "P" + (party.number + 1));
        if (this.tableFor(party) < 0 && this.queues.host.length >= config.hostQueueMax) {
          this.balked++;
          this.scheduleEvent(now, "PARTY_BALKED", party.id, undefined, { size });
          break;
        }
        this.arrived++;
        this.parties.set(party.id, party);
        this.arrivalLog.push(now);

        this.enqueue("host", party);

      }
      // (PARTY_BALKED needs nothing: the party never came in, so the event stops at the check above. It is there for the renderers and the count.)
      case "SEIZE_TABLE":

        this.setState(party, "READING_MENU");
        this.after(party, this.draw("menu", config.menu), "MENU_READ_COMPLETE");
        break;
      case "MENU_READ_COMPLETE":
        this.setState(party, "WAITING_FOR_WAITER_ORDER");
        this.scheduleEvent(now + this.draw("orderPatience", config.orderPatience), "ORDER_PATIENCE_OUT", party.id);
        this.enqueue("order", party);
        this.dispatchWaiters();
        break;
      case "SEIZE_WAITER_ORDER":
        this.setState(party, "ORDERING");
        this.task(party, this.draw("order", config.order), "RELEASE_WAITER_ORDER", ["waiters"], "order");
        break;
      case "RELEASE_WAITER_ORDER":
        this.release("waiters", party, "order");
        this.writeOrder(party);
        party.timestamps.orderPlaced = now;
        this.setState(party, "WAITING_FOR_COOK");
        this.scheduleEvent(now + this.draw("foodPatience", config.foodPatience), "FOOD_PATIENCE_OUT", party.id);
        this.enqueue("plan", party);   // the ticket rail
        this.dispatchKitchen();
        this.dispatchWaiters();
        break;
      case "ORDER_PATIENCE_OUT":
        // still nobody to take the order, and no waiter on the way: the party walks out
        if (party.queued.order) this.abandon(party, "order");
        break;
      case "FOOD_PATIENCE_OUT":
        // still no food, and none on its way to the table: the party walks out
        if (party.timestamps.foodServed === undefined && party.held["waiters:deliver"] === undefined) this.abandon(party, "food");
        break;
      case "SEIZE_COOK_PLAN":
        this.setState(party, "PLANNING");
        this.task(party, config.plan, "PLAN_COMPLETE", ["cooks"], "plan");
        break;
      case "PLAN_COMPLETE":
        this.release("cooks", party, "plan");
        party.timestamps.cookStarted = now;
        this.setState(party, "COOKING");
        party.parts = {};   // one part per kind of equipment the order needs; they are made in parallel
        for (const kind in config.parts) if (party.order[kind]) { party.parts[kind] = "queued"; this.enqueue(kind, party); }
        this.dispatchKitchen();
        break;
      case "SEIZE_STOVE": case "SEIZE_OVEN": case "SEIZE_COFFEE": {
        const kind = event.resourceId, spec = config.parts[kind];
        party.parts[kind] = "cooking";
        (party.partStays ||= {})[kind] = this.stay(this.partStats[kind]);
        this.task(party, spec.base + spec.perItem * party.order[kind], DES_PART_EVENTS[kind][1], [kind, "cooks"], kind);
        break;
      }
      case "COOK_COMPLETE": case "BAKE_COMPLETE": case "COFFEE_COMPLETE": {

        this.release("cooks", party, kind);
        party.parts[kind] = "done";

        party.partStays[kind].end = now;
        if (Object.values(party.parts).every(state => state === "done")) {
          this.setState(party, "WAITING_FOR_PLATING");
          this.enqueue("plate", party);
        }
        this.dispatchKitchen();
        break;
      }
      case "SEIZE_COOK_PLATE":

        this.task(party, config.plate, "PLATE_COMPLETE", ["cooks"], "plate");
        break;
      case "PLATE_COMPLETE":
        this.release("cooks", party, "plate");
        party.timestamps.foodReady = now;
        this.setState(party, "WAITING_FOR_WAITER_DELIVER");
        this.enqueue("run", party);   // the pass
        this.dispatchWaiters();
        this.dispatchKitchen();
        break;
      case "SEIZE_WAITER_DELIVER":
        this.setState(party, "FOOD_RUNNING");
        this.task(party, this.draw("run", config.run), "RELEASE_WAITER_DELIVER", ["waiters"], "deliver");
        break;
      case "RELEASE_WAITER_DELIVER":
        this.release("waiters", party, "deliver");
        party.timestamps.foodServed = now;
        this.record(this.waits.food, party.metrics.kitchenWaitDuration = now - party.timestamps.orderPlaced);
        this.setState(party, "EATING_AND_BILLING");
        this.after(party, this.draw("dine", config.dine), "DINING_COMPLETE");
        this.dispatchWaiters();
        break;
      case "DINING_COMPLETE":
        this.scheduleEvent(now, "RELEASE_TABLE", party.id, "tables");
        break;
      case "RELEASE_TABLE":

        party.stateStay.end = now;
        party.happy = m.tableWaitDuration <= targets.table && m.orderWaitDuration <= targets.order && m.kitchenWaitDuration <= targets.food;
        if (party.happy) this.happy++;
        this.parties.delete(party.id);
        this.departed++;
        this.departureLog.push([now, m.totalCycleTime]);

        break;
      }
    }
  }

  // A party gives up waiting for its food. It leaves every queue it stands in and gives its table back.
  // Whatever a cook is doing for it at that moment is finished and then thrown away.
  abandon(party, reason) {
    const now = this.currentTime;
    party.gaveUp = reason; this.abandonedFor[reason]++;

    this.release("tables", party, "table"); party.table = null;
    party.timestamps.departed = now;
    party.metrics.totalCycleTime = now - party.timestamps.arrival;
    this.setState(party, "ABANDONED");
    party.stateStay.end = now;
    this.parties.delete(party.id);
    this.abandoned++;
    this.departureLog.push([now, party.metrics.totalCycleTime]);
    this.wip(-1);
    if (Object.keys(party.held).length) this.ghosts.set(party.id, party);
    this.scheduleEvent(now, "PARTY_ABANDONED", party.id, undefined, { reason });
    this.dispatchTables();

  // Events for a party that has walked out: release what the kitchen was using for it.
  processGhost(event, ghost) {
    const task = { SEIZE_COOK_PLAN: "plan", PLAN_COMPLETE: "plan", SEIZE_COOK_PLATE: "plate", PLATE_COMPLETE: "plate" }[event.type]
      || (this.config.parts[event.resourceId] ? event.resourceId : null);
    if (!task || ghost.held["cooks:" + task] === undefined) return;
    if (this.config.parts[task]) this.release(task, ghost, task);
    this.release("cooks", ghost, task);
    if (!Object.keys(ghost.held).length) this.ghosts.delete(ghost.id);
    this.dispatchKitchen();
  }

  // ----- what renderers read: a snapshot of the state, and the telemetry
  snapshot() {
    const resources = {};
    for (const id in this.resources) {
      const r = this.resources[id];
      resources[id] = { capacity: r.capacity, allocated: r.allocated, units: r.units.map(unit => unit && { ...unit }),
                        leaving: r.leaving, goingOut: [...r.goingOut],
                        average: (() => { const cap = r.capArea + r.capacity * (this.currentTime - r.since); return cap ? (r.busyArea + r.allocated * (this.currentTime - r.since)) / cap : 0; })() };
    }
    const queues = {};
    for (const id in this.queues) queues[id] = [...this.queues[id]];
    return {
      time: this.currentTime, resources, queues,
      parties: new Map([...this.parties].map(([id, party]) => [id, { ...party }])),
      arrived: this.arrived, departed: this.departed, balked: this.balked, happy: this.happy, abandoned: this.abandoned, abandonedFor: { ...this.abandonedFor },
      eventsProcessed: this.eventsProcessed, pending: this.heap.length,
    };

  // Rolling figures over the last `window` seconds, for the operations HUD and Little's Law (L = lambda x W).
  telemetry(window = DES_WINDOW) {
    const now = this.currentTime, from = Math.max(0, now - window), span = now - from;
    while (this.arrivalLog.length && this.arrivalLog[0] < now - 600) this.arrivalLog.shift();
    while (this.departureLog.length && this.departureLog[0][0] < now - 600) this.departureLog.shift();
    const arrivals = this.arrivalLog.filter(t => t > from).length, cycles = this.departureLog.filter(([t]) => t > from).map(([, cycle]) => cycle);
    let area = 0;   // time-average of the work in progress over the window
    this.wipLog.forEach(([t, level], i) => {
      const end = this.wipLog[i + 1]?.[0] ?? now;
      if (end > from) area += level * (end - Math.max(t, from));

    const lambda = span ? arrivals / span : 0, W = cycles.length ? cycles.reduce((sum, c) => sum + c, 0) / cycles.length : 0;
    return { L: this.parties.size, averageL: span ? area / span : 0, lambda, W, predictedL: lambda * W, sample: cycles.length };
  }
}

// ===== js/gauges.js =====
// ---------- gauges ----------
// A gauge watches one yes/no or how-many reading of the engine (is this stove in use? how full is this
// pool?) and keeps its average over the whole run and over each 15-second slice of it.
let clock = 0;        // simulated seconds; the one clock of the page, which the engine is run up to
const WINDOW = 180;   // seconds of the past that the charts on real time show
const BUCKET = 15, KEEP = 40;
const gauges = [];
let bucketTime = 0;
function gauge(read) {
  const g = { read, sum: 0, acc: 0, history: [], changes: [] };
  gauges.push(g);
  return g;
}
// Runs every tick, whichever view is showing.
function sampleGauges(dt) {
  for (const g of gauges) {
    const reading = Number(g.read());
    g.sum += reading * dt; g.acc += reading * dt;
    if (reading === g.last) continue;
    g.changes.push([clock, g.last = reading]);   // when the reading changed, for the charts on real time
    while (g.changes.length > 2 && g.changes[1][0] < clock - WINDOW) g.changes.shift();
  }
  bucketTime += dt;
  if (bucketTime < BUCKET) return;
  for (const g of gauges) {
    g.history.push(g.acc / bucketTime);
    if (g.history.length > KEEP) g.history.shift();
    g.acc = 0;
  }
  bucketTime = 0;
}

// ===== js/selection.js =====
// ---------- selection and the details panel ----------
// One object can be selected at a time. The details panel is made of sections that fold away, each a
// card with a header: Selection (what is selected, with About, Metrics and Actions tabs), Event stream and Legend.
// Sections start folded. The panel remembers which sections are open and which tab is showing, so
// they stay as they were left while the selection and the view change.
let selected = null;
const folds = { selection: false, events: false, legend: false };   // which sections are open
let detailsTab = "about";                             // the tab showing in the Selection section
function select(info) {
  if (selected) selected.nodes.forEach(node => node.removeAttribute("data-selected"));
  selected = info;
  if (info) { info.nodes.forEach(node => node.setAttribute("data-selected", "")); setPanel(true); setFold("selection", true); setPicker(false); }   // selecting opens the panel and its Selection section
  renderCard();
}
function setPanel(open) {
  keep("panel", open);
  $("panel").classList.toggle("open", open);
  $("panel-divider").classList.toggle("open", open);
  renderMetrics();
  $("panel-toggle").setAttribute("aria-pressed", open);
  $("panel-toggle").title = open ? "Hide details" : "Show details";
  $("panel-toggle").setAttribute("aria-label", $("panel-toggle").title);
  $("icon-collapse").toggleAttribute("hidden", !open);   // the arrow shows which way a click will push the panel
  $("icon-expand").toggleAttribute("hidden", open);
}
function setFold(key, open) {
  folds[key] = open;
  keep("folds", { ...folds });
  const section = document.querySelector(`.fold[data-fold="${key}"]`), button = section.querySelector(".fold-toggle");
  section.querySelector(".fold-body").hidden = !open;
  button.setAttribute("aria-expanded", open);
  button.setAttribute("aria-label", `${open ? "Collapse" : "Expand"} ${section.querySelector("h3").textContent}`);
  renderMetrics();
  renderEvents();
}
function setTab(tab) {
  detailsTab = tab;
  keep("tab", tab);
  for (const button of $("tabs").children) button.setAttribute("aria-selected", button.dataset.tab === tab);
  $("about").hidden = Boolean(selected) && tab !== "about";   // with nothing selected there are no tabs, only the hint
  $("metrics").hidden = !selected || tab !== "metrics";
  $("actions").hidden = !selected || tab !== "actions";
  renderMetrics();
  renderActions();
}
// the metrics are redrawn several times a second, so only when they can be seen
const metricsShowing = () => Boolean(selected) && $("panel").classList.contains("open") && folds.selection && detailsTab === "metrics";
function setPicker(open) {
  $("picker").hidden = !open;
  $("picker-toggle").setAttribute("aria-expanded", open);
  if (open) { $("picker-filter").value = ""; updateActorList(); $("picker-filter").focus(); }
}
function renderCard() {
  const about = $("about"), head = $("selected-head");
  about.replaceChildren(); head.replaceChildren();
  $("tabs").hidden = !selected;
  if (!selected) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nothing selected. Click anything in the live view, or use the target button at the top to pick one by name.";
    about.appendChild(empty);
  } else {
    const name = document.createElement("h3"); name.textContent = selected.name;
    head.appendChild(name);   // only the name; what kind of thing it is, is the first line of About
    const card = document.createElement("div"); card.className = "about";
    const list = document.createElement("dl");
    // the About tab holds only what does not change; anything live belongs to the Metrics tab
    const rows = [["Kind", selected.kind], ["What it is", selected.what], ["Purpose", selected.purpose], ["Why it is here", selected.why],
                  ...(selected.extra || []).filter(row => typeof row[1] !== "function")].filter(row => row[1]);
    const spec = metricsFor(selected);
    if (spec.objective) rows.push(["Objective", spec.objective]);   // what this object is for, last on the card
    for (const [label, value] of rows) {
      const dt = document.createElement("dt"); dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value;
      list.append(dt, dd);
    }
    card.appendChild(list);
    about.appendChild(card);
  }
  setTab(detailsTab);   // the same tab as before, for the new selection
}
const isTargetNote = note => /^(Target|No target)/.test(note || "");   // which of a card's notes states its target
// The event stream: what the engine has just done, newest first. About thirty lines show; the rest
// can be scrolled to. While it is scrolled away from the top it stands still, so it can be read.
function renderEvents() {
  const box = $("events");
  if (folds.events) setText($("events-total"), `${desEngine.snapshot().eventsProcessed.toLocaleString("en-US")} events processed`);
  if (!folds.events || !$("panel").classList.contains("open") || box.scrollTop > 0) return;
  const lines = desRecent.map(event => `${event.timestamp.toFixed(1).padStart(7)}  ${event.type.padEnd(22)} ${event.entityId.padEnd(5)} ${event.resourceId || ""}`).join("\n");
  if (box.textContent !== lines) box.textContent = lines;
}
// folding a section by its header, and switching tabs
for (const section of document.querySelectorAll(".fold")) {
  section.querySelector("header").addEventListener("click", () => setFold(section.dataset.fold, !folds[section.dataset.fold]));
}
for (const button of $("tabs").children) button.addEventListener("click", () => setTab(button.dataset.tab));

// ===== js/panel-size.js =====
// ---------- the width of the details panel ----------
// The divider between the picture and the details can be dragged. The width is kept when the panel
// is collapsed and expanded, and across reloads of the page (in the browser's local storage).
const PANEL_WIDTH = { key: "cyber-kitchen.details-width", standard: 340, least: 260 };
function setPanelWidth(width, keep) {
  const most = Math.max(PANEL_WIDTH.least, document.querySelector(".workspace").clientWidth - 320);   // always leave room for the picture
  const px = Math.round(Math.min(Math.max(width, PANEL_WIDTH.least), most));
  document.documentElement.style.setProperty("--panel-width", px + "px");
  if (keep) try { localStorage.setItem(PANEL_WIDTH.key, px); } catch (error) { /* storage is off: the width lasts for this page only */ }
  return px;
}
{
  let saved = NaN;
  try { saved = Number(localStorage.getItem(PANEL_WIDTH.key)); } catch (error) { /* storage is off */ }
  setPanelWidth(saved || PANEL_WIDTH.standard, false);
  const divider = $("panel-divider"), workspace = document.querySelector(".workspace");
  let drag = null;
  divider.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, width: $("panel").getBoundingClientRect().width };
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging"); workspace.classList.add("resizing");
    e.preventDefault();
  });
  divider.addEventListener("pointermove", e => { if (drag) setPanelWidth(drag.width + (drag.x - e.clientX), false); });   // dragging left makes the details wider
  const drop = e => {
    if (!drag) return;
    setPanelWidth(drag.width + (drag.x - e.clientX), true);
    drag = null;
    divider.classList.remove("dragging"); workspace.classList.remove("resizing");
  };
  divider.addEventListener("pointerup", drop);
  divider.addEventListener("pointercancel", drop);
  divider.addEventListener("dblclick", () => setPanelWidth(PANEL_WIDTH.standard, true));   // back to the standard width
  window.addEventListener("resize", () => setPanelWidth(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--panel-width")) || PANEL_WIDTH.standard, false));
}

// ===== js/tokens.js =====
// ---------- tokens ----------
// Every moving thing in a view is a token with a place to be; each frame it glides part of the way there.
function setText(node, value) { if (node.textContent !== String(value)) node.textContent = value; }

    build(token.g, token);

// Move every token part of the way to its place, and see off the ones that have left the simulation.

      token.tx = token.home ? token.home.x : 1240;
      token.ty = token.home ? token.home.y : token.y;
      if (Math.abs(token.tx - token.x) + Math.abs(token.ty - token.y) < 4) { token.g.remove(); tokens.delete(token.key); continue; }
    }

// ===== js/route.js =====
// ---------- tokens that follow the arrows ----------
// Used by the graph views. A view gives the arrows it has drawn as edges, each with the points of its
// line. When a token has to go from one node to another, it is sent along the arrows that lead there,
// corner by corner. It leaves its node at the edge where the arrow starts and enters the last one at
// the edge where the arrow ends; a node it only passes through, it crosses through the centre.
// `centreOf` gives the centre of a node by its key.
function makeRouter(edges, centreOf) {
  const leaving = {};
  for (const edge of edges) (leaving[edge.from] ||= []).push(edge);
  // the arrows to follow from one node to another (fewest arrows), as one list of points; null if there is no way
  const route = (from, to) => {
    const cameBy = new Map([[from, null]]), queue = [from];
    while (queue.length) {
      const at = queue.shift();
      if (at === to) break;
      for (const edge of leaving[at] || []) if (!cameBy.has(edge.to)) { cameBy.set(edge.to, edge); queue.push(edge.to); }
    }
    if (from === to || !cameBy.has(to)) return null;
    const points = [];
    for (let edge = cameBy.get(to); edge; edge = cameBy.get(edge.from)) {
      points.unshift(...edge.points);
      if (edge.from !== from) points.unshift(centreOf(edge.from));   // a node it only passes through: straight across its centre
    }
    return points;
  };
  route.centreOf = centreOf;
  return route;
}
// Tell a token which node it now belongs in. If it is still on its way somewhere, it finishes that way
// first, crosses that node through the centre, and carries on from there: it never leaves the arrows.
function headFor(token, key, route) {
  if (token.at === key) return;
  const onward = (token.at && route(token.at, key)) || [];
  const under = token.route && token.route.length;
  if (!under && !onward.length && token.tx !== undefined) { token.x = token.tx; token.y = token.ty; }   // no arrow leads there: appear in place rather than cut across
  token.route = under ? [...token.route, route.centreOf(token.at), ...onward] : onward;
  token.at = key;
}
// Move a token for one frame: along its route while it has one, then gliding to its place (tx, ty).
// It moves at a steady pace that the eye can follow, and speeds up only when it has a long way to catch up.
function moveToken(token, seconds, ease) {
  const route = token.route;
  if (!route || !route.length) {
    token.x += (token.tx - token.x) * ease;
    token.y += (token.ty - token.y) * ease;
    return;
  }
  let left = Math.hypot(route[0].x - token.x, route[0].y - token.y);
  for (let i = 1; i < route.length; i++) left += Math.hypot(route[i].x - route[i - 1].x, route[i].y - route[i - 1].y);
  let step = Math.max(left / 0.7, 150) * seconds;
  while (step > 0 && route.length) {
    const next = route[0], distance = Math.hypot(next.x - token.x, next.y - token.y);
    if (distance <= step) { token.x = next.x; token.y = next.y; route.shift(); step -= distance; continue; }
    token.x += (next.x - token.x) * step / distance;
    token.y += (next.y - token.y) * step / distance;
    step = 0;
  }
}

// ===== js/metrics.js =====
// ---------- metrics ----------
// What every metrics card is built from. Each selectable object brings its own card (info.metrics).
const percent = share => Math.round(100 * share) + "%";
const atMost = (value, target) => value <= target ? ["On target", "good"] : value <= target * 1.25 ? ["A little over target", "warn"] : ["Over target", "bad"];
const atLeast = (value, target) => value >= target ? ["On target", "good"] : value >= target * 0.75 ? ["A little under target", "warn"] : ["Under target", "bad"];
const trend = (latest, average, format) => latest === undefined ? "No full 15-second slice yet."
  : `Latest 15 seconds: ${format(latest)}, ${Math.abs(latest - average) < 0.02 * (average || 1) ? "the same as" : latest > average ? "above" : "below"} its average so far.`;

function useMetrics(g, limit, { objective, measure, lowIsFine, numbers }) {
  const average = clock ? g.sum / clock : 0, target = lowIsFine ? `at most ${percent(limit)}` : `at least ${percent(limit)}`;
  return {
    objective, measure, numbers,
    value: percent(average), unit: "of the time so far",
    verdict: lowIsFine ? (average <= limit ? ["Within the limit", "good"] : ["Over the limit", "bad"]) : atLeast(average, limit),
    notes: [`Target: ${target}.`, trend(g.history.at(-1), average, percent)],
    chartTitle: "Use every 15 seconds", timelineTitle: "Use on the clock",
    chart: barChart(g.history, limit, v => lowIsFine ? v <= limit : v >= limit, percent),
    caption: "Each bar is 15 seconds of service, oldest on the left. Dashed line: the target.",
    timeline: readingTimeline(g),
    timelineCaption: "On the clock: blue while it is in use. " + NOW_NOTE,
  };
}
const NOW_NOTE = "The yellow line is now, and the last three minutes slide past it.";
const metricsFor = info => info.metrics();

// ===== js/charts.js =====
// ----- charts on real time -----
// All of these share one time axis: the last three minutes, sliding left, with "now" at the same
// place in every chart and marked by a yellow line.
const NOW_X = 252, PER_SECOND = NOW_X / WINDOW;
const timeX = t => NOW_X - (clock - t) * PER_SECOND;
const WAIT_COLOR = "var(--ready)", WORK_COLOR = "#8d949b", OWN_COLOR = "var(--eating)", USE_COLOR = "#3987e5";
function timeChart(height, draw) {
  const svg = el("svg", { class: "chart", viewBox: `0 0 300 ${height + 30}` });
  el("rect", { class: "chart-track", x: 0, y: 12, width: 300, height, rx: 3 }, svg);
  for (let t = Math.max(0, Math.ceil((clock - WINDOW) / 30) * 30); timeX(t) < 300; t += 30) {
    el("path", { d: `M${timeX(t)} 12v${height + 4}`, stroke: "var(--hairline)" }, svg);
    text(clockText(t), { x: timeX(t), y: height + 27, "text-anchor": "middle" }, svg);
  }
  draw((start, end, y, h, fill) => {
    const x1 = Math.max(0, timeX(start)), x2 = Math.min(NOW_X, timeX(end ?? clock));
    if (x2 > x1) el("rect", { x: x1, y: 12 + y, width: Math.max(x2 - x1, 1), height: h, fill }, svg);
  });
  el("path", { d: `M${NOW_X} 2v${height + 14}`, stroke: "var(--menu)", "stroke-width": 2.5 }, svg);
  text("now", { x: NOW_X + 4, y: 9, style: "fill: var(--menu)" }, svg);
  return svg;
}
// a reading over time: a strip that is filled while a thing is in use, or as tall as a queue is long
function readingTimeline(g) {
  const top = Math.max(1, ...g.changes.map(change => change[1]));
  return timeChart(36, span => g.changes.forEach(([time, value], i) => {
    if (value) span(time, g.changes[i + 1]?.[0], 36 - 36 * value / top, 36 * value / top, USE_COLOR);
  }));
}
// one thin bar per stay, as long as the stay lasted; stays that overlap are stacked
function staysTimeline(stays, target) {
  const rows = [], placed = stays.map(one => {
    let row = rows.findIndex(end => end <= one.start);
    if (row < 0) row = rows.length < 9 ? rows.length : 8;
    rows[row] = one.end ?? Infinity;
    return row;
  });
  const color = one => !target ? WORK_COLOR : (one.end ?? clock) - one.start <= target ? "var(--eating)" : "var(--waiting)";
  return timeChart(Math.max(rows.length, 4) * 7 + 2, span => stays.forEach((one, i) => span(one.start, one.end, 2 + placed[i] * 7, 5, color(one))));
}
// the parts of one ticket's or one party's time, end to end
function partsTimeline(start, parts) {
  return timeChart(18, span => {
    for (const [seconds, fill] of parts) {
      if (seconds) span(start, start + seconds, 3, 12, fill);
      start += seconds;
    }
  });
}

// bars over time, with a dashed line at the target
function barChart(values, target, good, format) {
  const svg = el("svg", { class: "chart", viewBox: "0 0 300 86" });
  if (!values.length) { text("No history yet.", { x: 0, y: 46 }, svg); return svg; }
  const top = Math.max(target || 0, ...values, 1e-9) * 1.18, width = 300 / Math.max(values.length, 20);
  values.forEach((v, i) => el("rect", {
    x: i * width + 1, y: 80 - 72 * v / top, width: width - 2, height: 72 * v / top + 0.5, rx: 1.5,
    fill: !target ? "#8d949b" : good(v) ? "var(--eating)" : "var(--waiting)" }, svg));
  el("path", { d: "M0 80.5H300", stroke: "var(--text-muted)" }, svg);
  if (target) {
    const y = 80 - 72 * target / top;
    el("path", { d: `M0 ${y}H300`, stroke: "var(--ready)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, svg);
    text(format(target), { x: 300, y: y - 3, "text-anchor": "end" }, svg);
  }
  return svg;
}
// one bar per part, with marks for the average and the target
function rowChart(rows) {
  const svg = el("svg", { class: "chart", viewBox: `0 0 300 ${rows.length * 26}` });
  const top = Math.max(1e-9, ...rows.flatMap(row => [row.value, row.average, row.target || 0])) * 1.1, x = v => 84 + 170 * v / top;
  rows.forEach((row, i) => {
    const y = i * 26 + 8;
    text(row.label, { x: 0, y: y + 9 }, svg);
    el("rect", { class: "chart-track", x: 84, y, width: 170, height: 10, rx: 3 }, svg);
    el("rect", { x: 84, y, width: 170 * row.value / top, height: 10, rx: 3, fill: !row.target ? "#8d949b" : row.value <= row.target ? "var(--eating)" : "var(--waiting)" }, svg);
    if (row.target) el("path", { d: `M${x(row.target)} ${y - 4}v18`, stroke: "var(--ready)", "stroke-width": 2 }, svg);
    if (row.average) el("path", { d: `M${x(row.average)} ${y - 3}v16`, stroke: "#fff", "stroke-width": 2 }, svg);
    text(clockText(row.value), { x: 300, y: y + 9, "text-anchor": "end" }, svg);
  });
  return svg;
}

// ===== js/metrics-card.js =====
// The Metrics tab, in sections with small headings: how the objective is measured, then one section
// per chart, then the target with the number so far and whether it is on target. What is happening
// now and the other numbers are underneath.
function renderMetrics() {
  const box = $("metrics");
  if (!metricsShowing()) return box.replaceChildren();
  const add = (tag, className, content, parent) => {
    const node = document.createElement(tag);
    node.className = className; node.textContent = content;
    parent.appendChild(node);
    return node;
  };
  const card = document.createElement("div"); card.className = "about metrics";
  const spec = metricsFor(selected);
  if (spec.measure) { add("h4", "section", "How it is measured", card); add("p", "measure", spec.measure, card); }
  // each chart is a section: a short heading, the chart on a grey ground so it reads as a picture, then what it shows
  for (const [title, chart, caption] of [[spec.chartTitle, spec.chart, spec.caption], [spec.timelineTitle, spec.timeline, spec.timelineCaption]]) {
    const figure = add("figure", "figure", "", card);
    add("h4", "section", title, figure);
    add("div", "plot", "", figure).appendChild(chart);
    add("figcaption", "metric-note", caption, figure);
  }
  const target = spec.notes.find(isTargetNote);
  add("h4", "section", "Target", card);
  if (target) add("p", "measure", target.replace(/^Target: /, "").replace(/^./, first => first.toUpperCase()), card);
  const headline = add("div", "metric-value", "", card);
  add("b", "", spec.value, headline);
  add("span", "", spec.unit, headline);
  add("i", "verdict " + spec.verdict[1], spec.verdict[0], headline).style.fontStyle = "normal";
  for (const note of spec.notes) if (note && note !== target) add("p", "metric-note", note, card);
  if (spec.numbers) {
    const numbers = add("dl", "", "", card);
    for (const [label, value] of spec.numbers) { add("dt", "", label, numbers); add("dd", "", value, numbers); }
  }
  box.replaceChildren(card);
}

      if (table) desPlace(token, table.place.seats[k].x, table.place.seats[k].y, DOOR);
      else desPlace(token, 18 + (k % 2) * 20, 330 + slot * 76 + Math.floor(k / 2) * 19, OUTSIDE);

// until all of it is there; then they move to the middle and the step runs. A step that needs nothing

// the resources along the top (drawn further down, once the boxes can be: see GRAPH_TOP)
const graphMetersLayer = el("g", {}, graphStatic);

  const { svg, w, h, zoom } = zoomState(), box = svg.getBoundingClientRect();
  const scale = Math.min(box.width / (w / zoom.k), box.height / (h / zoom.k));   // screen pixels per unit of the picture
  if (Math.abs(e.clientX - zoomDrag.x) + Math.abs(e.clientY - zoomDrag.y) > 4) zoomDrag.moved = true;
  if (!zoomDrag.moved) return;
  zoom.cx = zoomDrag.cx - (e.clientX - zoomDrag.x) / scale;
  zoom.cy = zoomDrag.cy - (e.clientY - zoomDrag.y) / scale;
  applyZoom();
});
window.addEventListener("pointerup", () => {
  zoomDragged = Boolean(zoomDrag && zoomDrag.moved);
  zoomDrag = null;
  if (zoomDragged) setTimeout(() => { zoomDragged = false; }, 0);   // only the click that ends this drag is swallowed
});

// ===== js/main.js =====
// ---------- main loop ----------
// One simulation: the DES engine. The page keeps the clock and tells the engine what time it is; the
// two views only draw what the engine holds.
let speed = 1, paused = false, last = performance.now(), lastListUpdate = 0;

function tick(dt) {
  clock += dt;
  desEngine.runUntil(clock);
  sampleGauges(dt);
}
function draw() {
  if (view === "des") drawDes();
  if (view === "graph") drawGraph();
  if (view === "score") drawScore();
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!paused) for (let i = 0; i < speed; i++) tick(dt);
  draw();
  if (now - lastListUpdate > 400) { lastListUpdate = now; updateActorList(); renderMetrics(); renderEvents(); renderActions(); }
  requestAnimationFrame(frame);
}

function setPaused(next) {
  paused = next;
  keep("paused", paused);
  $("icon-pause").toggleAttribute("hidden", paused);   // the button shows what a click will do
  $("icon-play").toggleAttribute("hidden", !paused);
  $("pause").title = paused ? "Resume" : "Pause";
  $("pause").setAttribute("aria-label", $("pause").title);
  $("pause").setAttribute("aria-pressed", paused);
}
$("pause").addEventListener("click", () => setPaused(!paused));
$("panel-toggle").addEventListener("click", () => setPanel(!$("panel").classList.contains("open")));
$("desview").addEventListener("click", () => select(null));
$("desgraph").addEventListener("click", () => select(null));
$("scoreview").addEventListener("click", () => select(null));
$("view-toggle").addEventListener("click", e => { e.stopPropagation(); setPicker(false); setSpeedMenu(false); setViewMenu($("view-menu").hidden); });
$("view-menu").addEventListener("click", e => e.stopPropagation());
$("picker-toggle").addEventListener("click", e => { e.stopPropagation(); setViewMenu(false); setSpeedMenu(false); setPicker($("picker").hidden); });
$("picker-filter").addEventListener("input", updateActorList);
$("picker").addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { setPicker(false); setViewMenu(false); setSpeedMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { setPicker(false); setViewMenu(false); setSpeedMenu(false); } });

// Start the page the way it was left: paused or running, at the same speed, on the same view, with the
// details panel, its sections and its tab as they were. An address that names a view wins over the remembered one.
const left = { ...prefs, folds: { ...prefs.folds } };   // read before the calls below write the page's opening state over it
renderCard();
setSpeed(SPEEDS.includes(left.speed) ? left.speed : 1);
setView(location.hash.slice(1) in VIEW_NODE ? location.hash.slice(1) : left.view in VIEW_NODE ? left.view : "des");
for (const key in folds) setFold(key, left.folds[key] === true);
setTab(["about", "metrics", "actions"].includes(left.tab) ? left.tab : "about");
setPanel(left.panel === true);
setPaused(left.paused === true);
requestAnimationFrame(frame);
  </script>
