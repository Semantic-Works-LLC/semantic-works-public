<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Works: Cyber Kitchen</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --hairline: #2c2c2a;
      --floor-dining: #24211d;
      --floor-kitchen: #1c2126;
      --wall: #898781;
      --wood: #6b4f34;
      --seat: #3b3936;
      --steel: #4a5158;
      --free: #898781;
      --arriving: #c3c2b7;
      --menu: #ffe100;
      --ready: #ff8a00;
      --waiting: #ff2d2d;
      --eating: #0ca30c;
      --select: #e3e1d6;   /* a light warm grey, from the page's own greys */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text-primary);
    }
    main { padding: 16px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }   /* the page is exactly one screen tall: the picture takes all the height the header leaves */
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
    h1 { font-size: 1.5rem; margin: 0; }   /* as in Episodes 1 and 2: bold, in the primary text colour */
    main > header { position: relative; }
    /* which view is on screen, in the middle of the top line: a blue button that opens the list of views */
    #view-switch { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
    #view-toggle { font-weight: 600; white-space: nowrap; padding: 6px 16px; }
    .controls { margin-left: auto; display: flex; gap: 6px; position: relative; }
    #picker {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 10;
      width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    [hidden] { display: none !important; }
    .tool { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; }
    .tool svg.solid { fill: currentColor; stroke-width: 1; }
    .tool.primary, .tool.primary:hover, .tool.primary[aria-pressed="true"] { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .tool.primary:hover { background: #1d4ed8; }
    /* the details arrow points right while the panel is open (click to collapse it), left while it is closed (click to expand it) */
    #legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
    /* the sections of the details panel: cards with a header that folds them away */
    .fold { border: 1px solid var(--hairline); border-radius: 10px; background: var(--page); margin-top: 10px; }
    .fold { overflow: hidden; }
    .fold > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 14px; margin: 0; cursor: pointer; background: #2f2f2d; }   /* a mid grey, between the panel and the card, so the heading reads as a bar */
    .fold > header:hover { background: #383836; }
    .fold > header h3 { font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin: 0; }
    .fold-toggle { display: inline-flex; padding: 3px; border-color: transparent; background: transparent; }
    .fold-toggle svg { width: 16px; height: 16px; fill: currentColor; transition: transform 150ms ease; pointer-events: none; }
    .fold-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
    .fold-body { padding: 12px 14px 14px; }
    #events { margin: 0; height: 45em; overflow: auto; font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-secondary); white-space: pre; }   /* thirty lines; scroll for more */
    .fold .about { border: 0; border-radius: 0; padding: 0; background: none; }
    .fold .metrics { margin-top: 0; }
    #selected-head h3 { font-size: 1.15rem; margin: 0; }
    #actions { padding-top: 10px; }
    #actions .action { display: grid; grid-template-columns: 108px 1fr; align-items: start; gap: 12px; margin-top: 10px; }
    #actions .action button { width: 100%; background: #2563eb; border-color: #3b82f6; color: #fff; font-weight: 600; }   /* the same blue as the pause button */
    #actions .action button:hover { background: #1d4ed8; }
    #actions .action button:disabled, #actions .action button:disabled:hover { background: #2563eb; }
    #actions .action span { font-size: 0.82rem; line-height: 1.45; color: var(--text-muted); padding-top: 5px; }
    .tabs { display: flex; gap: 4px; margin: 12px 0 4px; border-bottom: 1px solid var(--hairline); }
    .tabs { flex-wrap: wrap; }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--text-muted); padding: 6px 10px; }
    .tabs button:hover { background: transparent; color: var(--text-primary); }
    .tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--select); }
    #legend li { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px; font-size: 0.85rem; line-height: 1.35; color: var(--text-muted); }
    #legend li > :first-child { justify-self: center; }
    #legend h4.section:first-child { margin-top: 0; }
    #legend .legend-about { margin: 0 0 10px; font-size: 0.85rem; line-height: 1.35; color: var(--text-muted); }
    #legend ul + h4.section { margin-top: 18px; }
    #legend svg { width: 28px; height: 20px; display: block; }
    #legend .ring { display: block; }
    #legend .dot { font-style: normal; }
    .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:disabled:hover { background: var(--surface); }
    .menu-anchor { position: relative; display: inline-flex; }
    #speed-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; width: 92px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    svg.zoomed { cursor: grab; }
    svg.zoomed:active { cursor: grabbing; }
    #graph-menu { position: fixed; z-index: 20; width: 230px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #view-menu { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 10; width: 170px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    .view-item { display: flex; align-items: center; gap: 10px; text-align: left; border-color: transparent; background: transparent; }
    .view-item b { width: 18px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .view-item[aria-checked="true"] { border-color: var(--text-secondary); background: #2c2c2a; }
    #picker-filter {
      width: 100%; margin-top: 10px; padding: 6px 9px; font: inherit; font-size: 0.85rem;
      color: var(--text-primary); background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px;
    }
    button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover { background: #262624; }
    button[aria-pressed="true"] { border-color: var(--text-secondary); background: #2c2c2a; }

    .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px; }
    svg { display: block; width: 100%; height: 100%; }

    .ring { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
    .ring.free { background: var(--wood); border: 3px solid var(--free); }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; }
    .dot.waiter { background: #0d0d0d; border: 2px solid #fff; color: #fff; }
    .dot.cook { background: #fff; color: #0d0d0d; }
    .dot.guest { background: #b9bcc0; }

    /* SVG parts */
    .wall { fill: none; stroke: var(--wall); stroke-width: 4; stroke-linecap: square; }
    .zone-label { fill: var(--text-muted); font-size: 13px; letter-spacing: 2px; }
    .small-label { fill: var(--text-muted); font-size: 10px; }
    .table-top { fill: var(--wood); stroke: var(--free); stroke-width: 3; transition: fill 200ms ease, stroke 200ms ease; }
    .table.reserved .table-top { stroke: var(--arriving); }
    .table.reading .table-top { fill: var(--menu); stroke: var(--menu); }
    .table.ready .table-top, .table.ordering .table-top { fill: var(--ready); stroke: var(--ready); }
    .table.waiting .table-top { fill: var(--waiting); stroke: var(--waiting); }
    .table.eating .table-top { fill: var(--eating); stroke: var(--eating); }
    .table.reading .table-num, .table.ready .table-num, .table.ordering .table-num,
    .table.waiting .table-num, .table.eating .table-num { fill: #0d0d0d; }
    .table-num { fill: #fff; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .seat { fill: var(--seat); }
    .plate { fill: #ffffff; stroke: #0d0d0d; stroke-width: 1; visibility: hidden; }
    .table.eating .plate.on { visibility: visible; }
    .bubble { visibility: hidden; }
    .table.ready .bubble { visibility: visible; animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .steel { fill: var(--steel); stroke: #6a737b; stroke-width: 1.5; }
    .burner { fill: #23272b; stroke: #6a737b; stroke-width: 1.5; }
    .flame { fill: #eb6834; opacity: 0; }
    .progress-track { fill: #23272b; }
    .progress-bar { fill: #eb6834; }
    .ticket { fill: #f5f2e6; stroke: #b9b39c; stroke-width: 0.8; }
    .ticket-text { fill: #1a1a19; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .staff-label { font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .guest { stroke: #0d0d0d; stroke-width: 1; }
    .flame, .progress-track, .progress-bar { pointer-events: none; }
    [data-selectable] { cursor: pointer; }
    /* the selected object: a light grey outline with a faint halo, enough to find it without shouting */
    [data-selected] { filter: drop-shadow(0 0 3px rgba(227, 225, 214, 0.45)); }
    [data-selected] :is(.table-top, .flow-box, .loop-station, .steel, .burner, .ticket, .guest, .person, .dish, .token-box, .des-stage, .des-chip, .des-track, .des-rail, .graph-node),
    .guest[data-selected], .burner[data-selected], .study-unit[data-selected] { stroke: var(--select); stroke-width: 2.5; stroke-dasharray: none; }
    .table[data-selected] .table-top { stroke: #fff; stroke-width: 5; }
    /* a selected Scorecard tile keeps its own edge, green, amber or red; the outline is a ring just outside it */
    .score-ring { fill: none; display: none; }   /* not drawn at all until selected, so it does not change the measured size of the picture */
    [data-selected] > .score-ring { display: inline; stroke: var(--select); stroke-width: 2.5; }
    [data-selected] .score-tile { stroke: var(--hairline); stroke-width: 1.5; }
    [data-selected] .score-tile.won { stroke: var(--eating); }
    [data-selected] .score-tile.lost { stroke: var(--waiting); }
    [data-selected] .score-tile.near { stroke: var(--ready); }   /* a table keeps its state colour inside; the white ring says it is the selected one */

    /* service view */
    .flow-box { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }
    .step.wait .flow-box { stroke: var(--ready); stroke-dasharray: 6 4; }
    .line-name { fill: var(--text-primary); font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .line-avg { fill: var(--text-secondary); font-size: 10.5px; text-anchor: middle; }
    .line-tag { fill: var(--ready); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
    .line-arrow { fill: var(--text-muted); }
    .token-text { font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: #1a1a19; }
    .loop-arrow { fill: none; stroke: var(--text-muted); stroke-width: 2; }
    .loop-area { fill: none; stroke: var(--hairline); stroke-width: 1.5; }
    .loop-station { fill: #23272b; stroke: #6a737b; stroke-width: 1; }
    .loop-button { cursor: pointer; }
    .loop-button rect { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }
    .loop-button:hover rect { fill: #3a3a37; }
    .loop-button text { fill: var(--text-primary); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

    /* workflow view */
    .task-name { font-size: 10.5px; }
    .task-needs { fill: #7fb4ff; font-size: 9.5px; text-anchor: middle; }
    .task-zone { fill: var(--page); stroke: var(--hairline); stroke-width: 1; }
    .task-zone.queue { stroke: var(--text-muted); stroke-dasharray: 5 4; }   /* the waiting area: the same quiet grey as the section headings */
    .task-tag { fill: var(--text-muted); font-size: 7px; font-weight: 700; letter-spacing: 0.4px; }
    .task-tag.queue { fill: var(--ready); }
    .task-avg { fill: var(--text-secondary); font-size: 8.5px; text-anchor: end; }
    .objective-label { fill: var(--text-secondary); font-size: 12px; }
    .objective-value { fill: var(--text-primary); font-size: 12px; font-weight: 600; text-anchor: end; font-variant-numeric: tabular-nums; }

    /* model view */
    .flow-box.optional { stroke-dasharray: 7 4; }
    .flow-pill { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.5; }
    .flow-pill.won { stroke: var(--eating); }
    .flow-pill.lost { stroke: var(--waiting); }

    /* DES view */
    .des-mono { fill: var(--text-secondary); font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
    .des-meter.normal { fill: var(--eating); }
    .des-meter.constrained { fill: var(--ready); }
    .des-meter.saturated { fill: var(--waiting); animation: pulse 0.9s ease-in-out infinite; }
    .des-badge { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-anchor: end; }
    .des-badge.constrained { fill: var(--ready); }
    .des-badge.saturated { fill: var(--waiting); animation: pulse 0.9s ease-in-out infinite; }
    .des-chip { fill: #2c2c2a; stroke: var(--text-muted); stroke-width: 1; }
    .des-chip-text { fill: var(--text-primary); font-size: 9.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
    .des-stage { fill: var(--page); stroke: var(--hairline); stroke-width: 1.5; }
    :where(.des-stage).queue { stroke: var(--ready); stroke-dasharray: 5 4; }   /* these are kept weak, so the selection outline wins over them */
    :where(.des-stage).total { stroke: var(--text-muted); }
    :where(.des-stage).won { stroke: var(--eating); }
    :where(.des-stage).lost { stroke: var(--waiting); }
    :where(.des-stage).near { stroke: var(--ready); }
    .des-stage-name { fill: var(--text-secondary); font-size: 8.5px; text-anchor: middle; }
    .des-stage-count { fill: var(--text-primary); font-size: 17px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .des-tile-label { fill: var(--text-muted); font-size: 8.5px; }
    .des-tile-value { fill: var(--text-primary); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* unit squares and plain tokens */
    .study-block.picked, .study-unit.picked { stroke: var(--select); stroke-width: 2.5; stroke-dasharray: none; }
    /* one unit of a resource: a hollow square while it is free, crossed through while it is taken. No blue: blue is for buttons */
    .study-unit { fill: transparent; stroke: #6a737b; stroke-width: 1; }
    .graph-start { fill: var(--text-muted); stroke: none; }   /* where the process starts */
    .study-unit.used { fill: url(#unit-cross); }
    .study-unit.party { fill: url(#unit-cross); }   /* a party in the building: crossed, like any unit that is active */
    .study-unit.out { fill: url(#unit-out); }   /* out of service: off sick, broken down, out of use */
    .out-mark { stroke: var(--waiting); stroke-width: 6; stroke-linecap: round; pointer-events: none; }
    .study-unit.part.used { fill: #b9bcc0; }
    .study-token-body, .token-box { fill: #b9bcc0; stroke: #0d0d0d; stroke-width: 1; }

    /* layout: the workspace keeps one fixed height; opening the panel only narrows the live view */
    .workspace { display: flex; align-items: stretch; width: 100%; flex: 1; min-height: 360px; }   /* down to the bottom of the window */
    .view-card { flex: 1; min-width: 0; height: 100%; }
    .panel { width: 0; height: 100%; overflow: hidden; transition: width 250ms ease, margin-left 250ms ease; }
    .panel.open { width: var(--panel-width, 340px); }
    /* the divider between the picture and the details: drag it to make the details wider or narrower */
    #panel-divider { flex: none; width: 0; align-self: stretch; position: relative; cursor: col-resize; touch-action: none; }
    .panel.open ~ #panel-divider, #panel-divider.open { width: 12px; }
    #panel-divider::after { content: ""; position: absolute; left: 4px; top: calc(50% - 24px); width: 4px; height: 48px; border-radius: 2px; background: var(--hairline); transition: background 120ms ease; }
    #panel-divider:hover::after, #panel-divider.dragging::after { background: var(--text-muted); }
    .workspace.resizing .panel { transition: none; }
    .workspace.resizing { user-select: none; cursor: col-resize; }
    .panel-inner { width: var(--panel-width, 340px); height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; }
    .about, .actors { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px; background: var(--page); }
    .about .kind { display: inline-block; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px; }
    .about h3 { font-size: 1.15rem; margin: 10px 0 12px; }
    .about dt { font-size: 0.75rem; font-weight: 600; color: #d6d4ca; margin-top: 12px; }   /* a heading inside a card: a step brighter than the text under it */
    .about dd { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.45; color: var(--text-muted); white-space: pre-line; }   /* running text in the details panel is the same quiet grey as "Nothing selected" */
    .about dl { margin: 0; }
    .metrics { margin-top: 10px; }
    .metric-value { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; }
    .metric-value b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .metric-value span { font-size: 0.78rem; color: var(--text-muted); }
    .verdict { font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
    .verdict.good { background: var(--eating); color: #fff; }
    .verdict.warn { background: var(--ready); color: #0d0d0d; }
    .verdict.bad { background: var(--waiting); color: #fff; }
    .verdict.none { background: var(--hairline); color: var(--text-secondary); }
    .metric-note { font-size: 0.75rem; line-height: 1.45; color: var(--text-muted); margin: 6px 0 0; }
    .chart { height: auto; }
    .figure { margin: 0 0 16px; }
    /* section headings inside a tab: the same small muted line as the labels on About */
    h4.section { font-size: 0.75rem; font-weight: 600; color: #d6d4ca; margin: 12px 0 6px; }   /* about 2.4 times the brightness of the text under it, and bolder, since it is set smaller */
    .about .measure { margin: 0 0 4px; font-size: 0.9rem; line-height: 1.45; color: var(--text-muted); }
    .figure .plot { background: #2a2a2a; border-radius: 8px; padding: 10px 10px 6px; }
    .figure figcaption { margin: 6px 0 0; }
    .chart text { fill: var(--text-secondary); font-size: 10px; }
    .chart .chart-track { fill: #23272b; }
    .empty { color: var(--text-muted); font-size: 0.9rem; line-height: 1.45; margin: 0; }
    .actors h3 { font-size: 1rem; margin: 0; }
    .actors summary { font-size: 0.72rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; cursor: pointer; }
    .actors .none { color: var(--text-muted); font-size: 0.78rem; margin: 0; }
    .actors [data-group] { display: flex; flex-wrap: wrap; gap: 4px; }
    .actor { font-size: 0.75rem; padding: 3px 8px; background: var(--surface); }
    .actor[aria-pressed="true"] { border-color: var(--select); background: #3a3a37; }
    @media (max-width: 820px) {
      main { height: auto; display: block; }
      .workspace { flex-direction: column; height: auto; }
      .view-card { flex: none; height: auto; aspect-ratio: 1200 / 660; }
      .panel { display: none; height: auto; }
      .panel.open { display: block; width: 100%; margin: 12px 0 0; }
      #panel-divider { display: none; }
      .panel-inner { width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Semantic Works: Cyber Kitchen</h1>
      <span class="menu-anchor" id="view-switch">
        <button id="view-toggle" class="tool primary" aria-haspopup="menu" aria-expanded="false" aria-controls="view-menu"><span id="view-name"></span></button>
        <div class="actors" id="view-menu" role="menu" aria-label="Views" hidden></div>
      </span>
      <div class="controls">
        <button id="pause" class="tool primary" aria-pressed="false" aria-label="Pause" title="Pause">
          <svg id="icon-pause" class="solid" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg id="icon-play" class="solid" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <span class="menu-anchor">
          <button id="speed-toggle" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="speed-menu" aria-label="Speed: 1&times;. Choose a speed" title="Speed: 1&times;. Choose a speed">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8.500 8.500 0 1 1 16 0"/><path d="M12 17l4.500-7"/><circle cx="12" cy="17" r="1.200"/></svg>
            <span id="speed-label">1&times;</span>
          </button>
          <div class="actors" id="speed-menu" role="menu" aria-label="Speed" hidden></div>
        </span>
        <button id="zoom-in" class="tool" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoom-out" class="tool" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="zoom-fit" class="tool" aria-label="Show the whole picture" title="Show the whole picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8.500" y="8.500" width="7" height="7" rx="1"/></svg></button>
        <button id="picker-toggle" class="tool" aria-expanded="false" aria-controls="picker" aria-label="Find an object to select" title="Find an object to select"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.800"/><path d="M12 1.500v4M12 18.500v4M1.500 12h4M18.500 12h4"/></svg></button>
        <button id="panel-toggle" class="tool" aria-pressed="false" aria-controls="panel" aria-label="Show details" title="Show details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path id="icon-collapse" d="M6 12h6M9.500 9l3 3-3 3" hidden/><path id="icon-expand" d="M12 12H6M8.500 9l-3 3 3 3"/></svg>
        </button>
        <div class="actors" id="picker" hidden>
          <h3>Select an object</h3>
          <input id="picker-filter" type="search" placeholder="Filter by name, e.g. table or ticket 9" aria-label="Filter the list by name">
          <div id="actor-list"></div>
        </div>
      </div>
    </header>

    <div class="workspace">
    <div class="card view-card">
      <svg id="desview" viewBox="0 44 1200 644" role="img" aria-label="Floor plan: the restaurant floor drawn from the engine's state" hidden>
        <g id="des-static"></g>
        <g id="des-floor" transform="translate(12 34) scale(0.5)">
          <g id="des-floor-static"></g>
          <g id="des-floor-tokens"></g>
        </g>
      </svg>
      <svg id="scoreview" viewBox="0 0 1200 644" role="img" aria-label="Scorecard: the figures for the whole restaurant" hidden>
        <g id="score-static"></g>
      </svg>
      <svg id="desgraph" viewBox="0 52 1200 704" preserveAspectRatio="xMidYMin" role="img" aria-label="Pipeline graph: every queue, delay and task a party goes through as a node, with the fork where an order is split into parts made in parallel, the join where they come back together, and the pools of waiters, cooks and tables" hidden>
        <defs><pattern id="unit-out" width="1" height="1" patternContentUnits="objectBoundingBox"><path d="M0.150 0.850L0.850 0.150" stroke="#ef4444" stroke-width="0.140" stroke-linecap="round" fill="none"/></pattern><pattern id="unit-cross" width="1" height="1" patternContentUnits="objectBoundingBox"><path d="M0.150 0.150L0.850 0.850M0.850 0.150L0.150 0.850" stroke="#6a737b" stroke-width="0.110" stroke-linecap="round" fill="none"/></pattern><marker id="graph-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="#898781"/></marker><marker id="graph-arrow-resource" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a78bfa"/></marker><marker id="graph-arrow-actor" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b9bcc0"/></marker></defs>
        <g id="graph-static"></g>
        <g id="graph-parties"></g>
        <g id="graph-units"></g>
      </svg>
    </div>

    <div id="panel-divider" role="separator" aria-orientation="vertical" aria-label="Drag to resize the details panel" title="Drag to resize the details"></div>
    <aside class="panel" id="panel" aria-label="Details panel">
      <div class="panel-inner">
        <section class="fold" data-fold="selection">
          <header><h3>Selection</h3><button class="fold-toggle" aria-expanded="false" aria-label="Expand Selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l8 6-8 6z"/></svg></button></header>
          <div class="fold-body" hidden>
            <div id="selected-head"></div>
            <div class="tabs" id="tabs" role="tablist" hidden>
              <button role="tab" data-tab="about" aria-selected="true">About</button>
              <button role="tab" data-tab="metrics" aria-selected="false">Metrics</button>
              <button role="tab" data-tab="actions" aria-selected="false">Actions</button>
            </div>
            <div id="about"></div>
            <div id="metrics" hidden></div>
            <div id="actions" hidden></div>
          </div>
        </section>
        <section class="fold" data-fold="events">
          <header><h3>Event stream</h3><button class="fold-toggle" aria-expanded="false" aria-label="Expand Event stream"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l8 6-8 6z"/></svg></button></header>
          <div class="fold-body" hidden>
            <h4 class="section" id="events-total"></h4>
            <pre id="events" tabindex="0" aria-label="Latest events from the engine, newest first"></pre>
          </div>
        </section>
        <section class="fold" data-fold="legend">
          <header><h3>Legend</h3><button class="fold-toggle" aria-expanded="false" aria-label="Expand Legend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l8 6-8 6z"/></svg></button></header>
          <div class="fold-body" hidden>
            <div id="legend"></div>
          </div>
        </section>
      </div>
    </aside>
    </div>
  </main>

  <script>
/* @inline js/modules.txt */
  </script>
</body>
</html>
